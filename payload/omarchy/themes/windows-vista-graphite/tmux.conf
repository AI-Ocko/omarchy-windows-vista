# Windows Vista status bar for tmux (Aero (Graphite)). Sourced LAST by
# ~/.config/tmux/tmux.conf from the active theme and pushed into a running
# server by vista-mode. Sets ONLY options tmux.conf also sets, so re-sourcing
# tmux.conf (what `vista-mode off` does) puts them back. PLACEHOLDER colours.
set -g status-position bottom
set -g status-style "bg=#202020,fg=#FFFFFF"
