# Windows Vista -- cmd.exe. The same in every Vista scheme.
# ~/.config/foot/foot.ini includes this file LAST, so every key here wins.
[main]
# Consolas (Vista's console font, installed with the assets); the size is a
# starting value that `vista-mode sizes` sets to Omarchy's terminal size.
# JetBrainsMono NF keeps Nerd glyphs, braille and powerline working.
font=Consolas:size=9,JetBrainsMono Nerd Font:size=9
pad=2x2
title=C:\Windows\system32\cmd.exe
locked-title=yes

[cursor]
# cmd.exe: blinking underscore, hidden while unfocused.
style=underline
blink=yes
blink-rate=530
underline-thickness=3px
unfocused-style=none

# The cmd.exe console palette, with six colours that are too dark on black
# (below 4.5:1) raised to 5:1, same hue. The same values as the Vista neovim.lua.
# Originals, to undo: regular1=800000 regular2=008000 regular4=000080
# regular5=800080 regular6=008080 bright4=0000FF.
[colors-dark]
alpha=1.0
alpha-mode=matching
foreground=C0C0C0
background=000000
selection-foreground=000000
selection-background=C0C0C0
cursor=000000 FFFFFF
regular0=000000
regular1=F90000
regular2=009100
regular3=808000
regular4=6868FF
regular5=DB00DB
regular6=008A8A
regular7=C0C0C0
bright0=808080
bright1=FF0000
bright2=00FF00
bright3=FFFF00
bright4=8080FF
bright5=FF00FF
bright6=00FFFF
bright7=FFFFFF
